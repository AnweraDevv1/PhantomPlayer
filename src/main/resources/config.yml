# ============================================================
#  PhantomPlayer — конфигурация
# ============================================================

# Настройки по умолчанию для новых ботов
defaults:
  # Показывать ли бота в списке игроков (TAB) и в /list
  tab-visible: true
  # Игровой режим: SURVIVAL / CREATIVE / ADVENTURE / SPECTATOR
  gamemode: SURVIVAL
  # Максимальное здоровье
  max-health: 20.0
  # Бот получает урон
  invulnerable: false
  # Бот роняет инвентарь при смерти
  drop-inventory-on-death: true
  # Автоматически возрождать бота после смерти
  auto-respawn: true
  # Задержка авто-респавна в тиках (20 = 1 секунда)
  auto-respawn-delay: 100
  # Скорость ходьбы (обычная скорость игрока = 0.2)
  walk-speed: 0.2
  # Радиус обзора для ИИ (в блоках)
  look-radius: 16.0

# Настройки ИИ
ai:
  # Как часто обновляется логика ИИ (в тиках).
  # 1 = максимально плавно (нужно для режима вселения), 2 = экономнее.
  tick-interval: 1
  # Множитель скорости ходьбы ИИ (1.0 = как обычный игрок)
  speed-multiplier: 1.0
  # Радиус, в котором бот следует за целью
  follow-distance: 3.0
  # Максимальное расстояние следования, после которого бот телепортируется
  follow-teleport-distance: 40.0
  # Радиус поиска врагов в режимах GUARD / HUNT
  attack-radius: 12.0
  # Задержка между ударами в тиках
  attack-cooldown: 12
  # Дальность атаки
  attack-reach: 3.2

# Настройки «вселения» (possession)
possession:
  # Скрывать реальное тело игрока, пока он управляет ботом
  hide-real-body: true
  # Делать реального игрока неуязвимым во время вселения
  protect-real-body: true
  # Автоматически выходить из бота при его смерти
  release-on-death: true
  # Отдавать игроку инвентарь бота на время вселения
  # (всё, что наберёшь за бота, останется у бота после выхода)
  sync-inventory-view: true
  # Разрешить менять игровой режим прямо во время вселения (/phantom gm)
  allow-gamemode-change: true
  # Максимальная дистанция, на которой можно вселиться (-1 = без ограничений)
  max-distance: -1

# Реализм
realism:
  # Бот дышит под водой как игрок (тонет)
  drowning: true
  # Бот испытывает голод
  hunger: false
  # Бот горит на солнце? (нет — он же игрок) / горит в огне — да
  fire-damage: true
  # Естественные покачивания головой в простое
  idle-head-movement: true
  # Случайные покачивания рук / моргание активности
  idle-swing: false
  # Бот отправляет сообщения в чат от своего имени
  chat-enabled: true

# Сохранение
persistence:
  # Сохранять ботов при выключении сервера и восстанавливать при запуске
  save-bots: true
  # Автосохранение каждые N секунд (0 = выключено)
  autosave-interval: 300

# Лимиты
limits:
  # Максимум ботов на сервере (-1 = без лимита)
  max-bots-global: 50
  # Максимум ботов на одного игрока (-1 = без лимита)
  max-bots-per-player: 5

# Сообщения
messages:
  prefix: '<gradient:#8A2BE2:#00E5FF><bold>Phantom</bold></gradient> <dark_gray>»</dark_gray> '
